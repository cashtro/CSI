createRdv:
  post:
    tags:
      - Appointments
    summary: Create new appointment
    security:
      - BearerAuth: []
    requestBody:
      content:
        application/json:
          schema:
            type: object
            properties:
              disponibilite_id:
                type: integer
              id_eleve:
                type: string
                format: uuid
            required:
              - disponibilite_id
              - id_eleve
    responses:
      201:
        description: Appointment created
        content:
          application/json:
            schema:
              type: object
              properties:
                id:
                  type: integer
                payment_id:
                  type: string
      500:
        description: Server error
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Error'