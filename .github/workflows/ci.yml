name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: innomax-html-package
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: innomax-html-package/package-lock.json
      - run: npm ci
      - name: Syntax check server code
        run: |
          for f in server.js $(git ls-files 'routes(api)/*.js' 'routes(api)/utils/*.js'); do node --check "$f"; done
      - run: npm test
        env:
          NODE_ENV: test
